<h1 mat-dialog-title>Connect to OBS Web Mixer Server</h1>
<div mat-dialog-content>
    <div class="p-2">

        <!-- Bind the form to the FormGroup -->
        <form [formGroup]="connectionForm">
            <!-- Server Address Input -->
            <mat-form-field appearance="outline" class="full-width pt-2">
                <mat-label>Server Address</mat-label>
                <input
                    matInput
                    formControlName="serverAddress"
                    placeholder="Address ending in ngrok-free.app"
                />
            </mat-form-field>
        </form>

        <mat-expansion-panel class="mb-5">
            <mat-expansion-panel-header>
                <mat-panel-title>Need help?</mat-panel-title>
            </mat-expansion-panel-header>
            <p>
                
            </p>
            <p>
                If you are have any questions, feel free to shoot me an
                email at
                <a href="mailto:henley.austin@gmail.com"
                    >henley.austin&#64;gmail.com</a
                >.
            </p>
        </mat-expansion-panel>
    </div>
</div>

<div mat-dialog-actions align="end">
    <div
        [matTooltip]="
            connectionForm.invalid ? 'Enter valid details to continue' : ''
        "
    >
        <button
            mat-raised-button
            color="primary"
            (click)="submit()"
            [disabled]="connectionForm.invalid"
        >
            Connect
        </button>
    </div>
</div>
