<h1 mat-dialog-title>Trouble connecting to OBS</h1>
<div mat-dialog-content>
    <div class="p-2">
        <p>
            Looks like we lost connection to your server. Make sure OBS is still open on the host computer and try again.
        </p>
        <a href=""></a>
    </div>
</div>
<div mat-dialog-actions align="end">
    <div>
        <button mat-raised-button color="primary">Try Again</button>
    </div>
</div>
